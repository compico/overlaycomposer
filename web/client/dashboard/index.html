<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay Composer</title>
  <style>
    :root { color-scheme: dark; --bg: #16161a; --panel: #1e1e24; --line: #2c2c35; --text: #e8e8ec; --dim: #9a9aa6; --accent: #9146ff; --row: 120px; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header .sp { flex: 1; }
    button, select, header a { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; text-decoration: none; cursor: pointer; }
    button:hover:not(:disabled), header a:hover, select:hover { border-color: var(--accent); }
    button:disabled { opacity: .4; cursor: default; }
    button.on { border-color: var(--accent); background: #2a2140; }
    #msg { color: var(--dim); font-size: 12px; }
    main { flex: 1; overflow: auto; padding: 10px; }
    #grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-auto-rows: var(--row); gap: 10px; }
    .panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .panel > h2 { display: flex; align-items: center; gap: 4px; margin: 0; padding: 4px 8px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); border-bottom: 1px solid var(--line); min-height: 24px; }
    .panel > h2 .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .panel > h2 button { padding: 0 6px; font-size: 12px; line-height: 20px; }
    .body { position: relative; flex: 1; min-height: 0; }
    .body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
    .hint { padding: 14px; color: var(--dim); }
    .hint a { color: var(--accent); }
    .empty { padding: 30px; color: var(--dim); text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Overlay Composer</h1>
    <span id="msg"></span>
    <span class="sp"></span>
    <select id="add" hidden aria-label="Add widget"></select>
    <button id="reset" hidden>Reset</button>
    <button id="edit">Edit layout</button>
    <a href="/editor">Editor</a>
    <a href="/deck">Deck</a>
  </header>
  <main>
    <div id="grid"></div>
    <div id="empty" class="empty" hidden>No widgets for the dashboard yet. Install a plugin with a dashboard widget (for example <b>Twitch tools</b>) from the plugin store in the <a href="/editor" style="color:var(--accent)">editor</a>.</div>
  </main>
  <script type="module" src="/dist/dashboard.js"></script>
</body>
</html>
