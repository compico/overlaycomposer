<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overlay Composer</title>
  <style>
    :root { color-scheme: dark; --bg: #16161a; --panel: #1e1e24; --line: #2c2c35; --text: #e8e8ec; --dim: #9a9aa6; --accent: #9146ff; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 15px; font-weight: 600; }
    header nav { margin-left: auto; display: flex; gap: 8px; }
    header a { color: var(--text); text-decoration: none; padding: 5px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
    header a:hover { border-color: var(--accent); }
    main { flex: 1; min-height: 0; display: flex; padding: 10px; }
    section.panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    section.panel > h2 { margin: 0; padding: 8px 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); border-bottom: 1px solid var(--line); }
    #chatBox { position: relative; flex: 1; min-height: 0; }
    #chatBox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; }
    #chatHint { padding: 16px; color: var(--dim); }
    #chatHint a { color: var(--accent); }
    #chatHint[hidden], #chatBox iframe[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <h1>Overlay Composer</h1>
    <span id="conn" style="color:var(--dim);font-size:12px"></span>
    <nav>
      <a href="/editor">Editor</a>
      <a href="/deck">Deck</a>
    </nav>
  </header>
  <main>
    <section class="panel">
      <h2>Chat</h2>
      <div id="chatBox">
        <div id="chatHint">Loading…</div>
      </div>
    </section>
  </main>
  <script type="module" src="/dist/dashboard.js"></script>
</body>
</html>
