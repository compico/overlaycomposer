name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  # Ручной запуск: Actions → CI → Run workflow (выбрать ветку) — можно прогнать проверки на любой ветке до открытия PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Полная проверка на Linux: форматирование, vet, тесты с -race, типы клиента, сборка бандлов и кросс-компиляция.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Зависимости клиента (three.js, typescript)
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Не отформатировано (gofmt -w):"; echo "$out"; exit 1; fi
      - name: Бандлы клиента (web/dist нужен для go:embed)
        run: go run ./cmd/build client
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: |
          set +e
          go test -race -count=1 ./... > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            # упавшие тесты — отдельными аннотациями (видны в сводке запуска и через API)
            grep -E '^(--- FAIL|FAIL|panic:|WARNING: DATA RACE)|_test\.go:[0-9]+:|\.go:[0-9]+ \+0x' test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - name: tsc (клиент и SDK)
        run: npm run check
        working-directory: web
      - name: Тесты клиентской логики (TS)
        run: node --experimental-strip-types --test web/shared/geometry.test.ts web/shared/history.test.ts web/shared/snap.test.ts web/shared/gestures.test.ts web/client/editor/lib/store.test.ts web/client/editor/features/notifications/model.test.ts web/client/editor/features/store/model.test.ts web/client/editor/features/scene-binding/model.test.ts web/client/editor/features/obs-import/model.test.ts web/client/editor/features/settings.models.test.ts web/client/editor/features/editor/model.test.ts web/client/editor/features/panels.models.test.ts web/client/editor/features/keyboard/model.test.ts web/client/editor/features/live/model.test.ts web/client/editor/features/copy/model.test.ts web/client/editor/features/add-source/model.test.ts web/client/editor/features/plugin-settings/model.test.ts web/client/editor/features/properties/model.test.ts web/client/editor/features/view-prefs/model.test.ts web/client/editor/features/obs-status/model.test.ts
      - name: Кросс-сборка (без cgo, как в релизе)
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/overlay-composer
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/overlay-composer

  # Windows: код под windows (DPAPI для secret.key, трей, автозапуск) на Linux не выполняется — гоняем тесты там.
  # continue-on-error: пока не было ни одного зелёного прогона на Windows, красный результат не блокирует PR;
  # когда стабильно проходит — убрать эту строку.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Зависимости клиента
        run: npm ci --no-audit --no-fund
        working-directory: web
      - name: Бандлы клиента
        run: go run ./cmd/build client
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set +e
          go test -count=1 ./... > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            # упавшие тесты — отдельными аннотациями (видны в сводке запуска и через API)
            grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' test.log | head -40 | while IFS= read -r l; do echo "::error::${l//$'\r'/}"; done
          fi
          exit $code
